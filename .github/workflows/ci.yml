name: CI

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version-file: .nvmrc
          cache: npm
      # Firestore Emulator は Java 21 以上が必要
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'
      - name: Emulator のキャッシュ
        uses: actions/cache@v4
        with:
          path: ~/.cache/firebase/emulators
          key: firebase-emulators-${{ hashFiles('package-lock.json') }}
          restore-keys: firebase-emulators-
      - run: npm ci
      - name: 型チェック
        run: npm run typecheck
      - name: Lint
        run: npm run lint
      - name: 単体テスト
        run: npm run test:unit
      - name: ルールのテスト（Firestore Emulator）
        run: npm run test:rules
      - name: データアクセスの結合テスト（Firestore Emulator）
        run: npm run test:data
      - name: ビルド
        run: npm run build
